name: 功能建议
description: 提出一个想法或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景，再说方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
    validations:
      required: false
